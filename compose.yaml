# Local development stack. Use --env-file .env.docker on every Compose command.
x-app: &app
  build:
    context: .
    target: runtime
  environment: &app-env
    DEBUG: "false"
    SECRET_KEY: ${SECRET_KEY:?Run the Docker environment setup first}
    DATABASE_URL: postgresql+psycopg://nexa:nexa_password@postgres:5432/nexa_wallet_dev
    REDIS_URL: redis://redis:6379/0
    MOYASAR_SECRET_KEY: ${MOYASAR_SECRET_KEY:-sk_test_YOUR_KEY}
    MOYASAR_WEBHOOK_SECRET: ${MOYASAR_WEBHOOK_SECRET:-}
    MOYASAR_TOPUP_ALLOWED_CURRENCIES: ${MOYASAR_TOPUP_ALLOWED_CURRENCIES:-AED}
  init: true

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: nexa_password
      POSTGRES_DB: nexa_wallet_dev
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa -d nexa_wallet_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 5s

  moyasar-worker:
    <<: *app
    profiles: ["payments"]
    command: ["python", "-m", "app.workers.moyasar_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  reconciliation-worker:
    <<: *app
    profiles: ["payments"]
    command: ["python", "-m", "app.workers.topup_reconciliation_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  tests:
    <<: *app
    profiles: ["tools"]
    build:
      context: .
      target: test
    # Tests use isolated SQLite data and fake provider responses, never your API key.
    environment:
      <<: *app-env
      SECRET_KEY: isolated-test-key-not-for-api-use
      DATABASE_URL: "sqlite:///:memory:"
      MOYASAR_SECRET_KEY: sk_test_YOUR_KEY
      MOYASAR_WEBHOOK_SECRET: isolated-test-webhook-secret

volumes:
  postgres_data:
  redis_data:
