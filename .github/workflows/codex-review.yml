name: Codex PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review changes
    # API secrets are not provided to forks or Dependabot. The action also
    # restricts triggering users to write collaborators by default.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Check API key configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Add the OPENAI_API_KEY repository secret to enable Codex PR reviews."
            exit 1
          fi

      - name: Check out PR code and history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run Codex review
        id: codex
        uses: openai/codex-action@v1
        env:
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review.md
          sandbox: read-only
          safety-strategy: drop-sudo

  publish:
    name: Publish review comment
    needs: review
    if: needs.review.outputs.final_message != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      # No checkout or OpenAI key in this job. Review text is passed as data.
      - name: Create or update Codex comment
        uses: actions/github-script@v7
        env:
          CODEX_REVIEW: ${{ needs.review.outputs.final_message }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: issue_number,
            });
            if (pr.state !== 'open' || pr.head.sha !== process.env.REVIEW_HEAD_SHA) {
              core.info('Skipping feedback for a closed PR or outdated commit.');
              return;
            }

            const marker = '<!-- nexa-codex-review -->';
            const review = process.env.CODEX_REVIEW.trim();
            if (!review) return;
            const limit = 55000;
            const text = review.length > limit
              ? review.slice(0, limit) + '\n\n_Review truncated to fit a GitHub comment._'
              : review;
            const body = `${marker}\n## Codex review\n\nCommit: ${process.env.REVIEW_HEAD_SHA}\n\n${text}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.startsWith(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
